publish:
  name: Publish raw MQTT
  description: >-
    Publish any message to the TV's MQTT broker. Use "service" plus "action" for
    the normal /remoteapp/tv/<service>/<client>/actions/<action> tree, or
    "topic" to publish to a completely arbitrary topic.
  fields:
    service:
      name: Service
      description: The VIDAA service name. Mutually exclusive with "topic".
      required: false
      example: ui_service
      selector:
        select:
          options:
            - remote_service
            - ui_service
            - platform_service
    action:
      name: Action
      description: Action name, used together with "service".
      required: false
      example: changesource
      selector:
        text:
    topic:
      name: Topic
      description: Full MQTT topic. Mutually exclusive with "service".
      required: false
      example: /remoteapp/tv/ui_service/00:11:22:33:44:55$normal/actions/applist
      selector:
        text:
    payload:
      name: Payload
      description: String, or an object/list which is encoded as JSON.
      required: false
      example: '{"sourceid": "4"}'
      selector:
        object:
    entry_id:
      name: Entry ID
      description: Only needed when more than one TV is configured.
      required: false
      selector:
        text:

send_key:
  name: Send key
  description: >-
    Send a single remote key to the TV. The dropdown lists every key VIDAA
    remotes are known to send, but any value is accepted — the TV silently
    ignores keys it does not implement, so experimenting is safe. The KEY_
    prefix is optional. For sequences with repeats and delays, use
    remote.send_command on the remote entity instead.
  fields:
    key:
      name: Key
      description: The key to send, for example KEY_CHANNELUP.
      required: true
      example: KEY_CHANNELUP
      selector:
        select:
          custom_value: true
          mode: dropdown
          options:
            - KEY_POWER
            - KEY_SOURCE
            - KEY_INPUT
            - KEY_TV
            - KEY_HOME
            - KEY_MENU
            - KEY_BACK
            - KEY_RETURNS
            - KEY_EXIT
            - KEY_SETTINGS
            - KEY_UP
            - KEY_DOWN
            - KEY_LEFT
            - KEY_RIGHT
            - KEY_OK
            - KEY_VOLUMEUP
            - KEY_VOLUMEDOWN
            - KEY_MUTE
            - KEY_CHANNELUP
            - KEY_CHANNELDOWN
            - KEY_LIST
            - KEY_FAV
            - KEY_GUIDE
            - KEY_EPG
            - KEY_0
            - KEY_1
            - KEY_2
            - KEY_3
            - KEY_4
            - KEY_5
            - KEY_6
            - KEY_7
            - KEY_8
            - KEY_9
            - KEY_PLAY
            - KEY_PAUSE
            - KEY_STOP
            - KEY_FORWARDS
            - KEY_BACKS
            - KEY_RECORD
            - KEY_RED
            - KEY_GREEN
            - KEY_YELLOW
            - KEY_BLUE
            - KEY_INFO
            - KEY_SUBTITLE
            - KEY_AUDIO
            - KEY_SLEEP
            - KEY_PICTURE
            - KEY_SOUND
            - KEY_NETFLIX
            - KEY_YOUTUBE
            - KEY_AMAZON
            - KEY_TEXT
            - KEY_PREVIOUS
            - KEY_NEXT
    entry_id:
      name: Entry ID
      description: Only needed when more than one TV is configured.
      required: false
      selector:
        text:

send_text:
  name: Send text
  description: >-
    Type text into whatever field the TV currently has focused, such as a
    search box or a login form. Not all firmware supports this; on those the
    TV simply ignores it.
  fields:
    text:
      name: Text
      description: The text to type.
      required: true
      example: stranger things
      selector:
        text:
    entry_id:
      name: Entry ID
      description: Only needed when more than one TV is configured.
      required: false
      selector:
        text:

refresh:
  name: Refresh
  description: Ask the TV to resend its source list and app list.
  fields:
    entry_id:
      name: Entry ID
      description: Only needed when more than one TV is configured.
      required: false
      selector:
        text:
